name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Generate main metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Algiers
          config_order: base.header, base.activity, base.community, languages, lines, topics, base.repositories, base.metadata
          plugin_languages: yes
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: >
            html,
            css,
            tex,
            jupyter notebook,
            dockerfile,
            makefile
          plugin_languages_colors: 8B5CF6
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

      - name: Generate isometric calendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          base: ""
          config_timezone: Africa/Algiers
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.plugin.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          base: ""
          config_timezone: Africa/Algiers
          plugin_calendar: yes
          plugin_calendar_limit: 1
