name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ============ MAIN CARD ============
      - name: Core metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Africa/Algiers
          config_order: base.header, base.activity, base.community, languages, activity, lines, base.repositories, base.metadata

          # ---- languages: count everything, hide markup noise ----
          plugin_languages: yes
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: "html, css, tex, jupyter notebook, dockerfile, makefile"
          plugin_languages_colors: 8B5CF6

          # ---- lines of code changed ----
          plugin_lines: yes
          plugin_lines_sections: base

          # ---- recent activity feed ----
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
          plugin_activity_filter: all
          plugin_activity_visibility: all

          # ---- repos you own, incl. private if token allows ----
          repositories_affiliations: owner, collaborator
          repositories_batch: 100

      # ============ ISOCALENDAR (3D contribution wave) ============
      - name: Isocalendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          base: ""
          config_timezone: Africa/Algiers
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
