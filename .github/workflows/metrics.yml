name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ---- MAIN CARD ----
      - name: Core metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Africa/Algiers
          config_order: base.header, base.activity, base.community, languages, activity, notable, base.repositories, base.metadata

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 12
          plugin_languages_colors: 8B5CF6

          plugin_lines: yes
          plugin_lines_sections: base

          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 14
          plugin_activity_filter: all

          plugin_notable: yes
          plugin_notable_types: commit

      # ---- ISOCALENDAR ----
      - name: Isocalendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          base: ""
          config_timezone: Africa/Algiers
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---- HABITS ----
      - name: Habits
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.plugin.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          base: ""
          config_timezone: Africa/Algiers
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # ---- ACHIEVEMENTS ----
      - name: Achievements
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.plugin.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: tchopiz
          base: ""
          config_timezone: Africa/Algiers
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
